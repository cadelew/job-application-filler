<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tricky Form Fixture</title>
    <style>
      .visually-hidden {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Tricky Application</h1>
    <form id="app">
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="prefilled@example.com" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" disabled />

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="linkedin" type="url" readonly value="" />

      <div class="visually-hidden">
        <label for="hidden_name">Hidden Name</label>
        <input id="hidden_name" name="hidden_name" type="text" />
      </div>

      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" />

      <label for="auth">Are you legally authorized to work in the US?</label>
      <input id="auth" name="auth" type="text" />

      <button type="submit" id="submit">Submit Application</button>
    </form>
    <script>
      window.__submitClicks = 0;
      document.getElementById('app').addEventListener('submit', (e) => {
        e.preventDefault();
        window.__submitClicks += 1;
      });
      document.getElementById('submit').addEventListener('click', () => {
        window.__submitClicks += 1;
      });
    </script>
  </body>
</html>
